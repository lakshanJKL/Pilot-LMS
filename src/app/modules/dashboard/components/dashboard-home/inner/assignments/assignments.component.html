<div class="container" style="margin-top: 3%">
    <div class="course-header">
        <div class="head-title">
            <span>Assignments</span>
        </div>
        <div class="btn-bar">
            <div class="inner-btn-bar">
                <button mat-raised-button class="br-btn" style="vertical-align:middle">
                    <span>Management</span></button>
                <button mat-raised-button class="br-btn" style="vertical-align:middle"
                        routerLink="/dashboard/home/courses/all">
                    <span>Courses</span></button>
                <button mat-raised-button class="new-c-btn" (click)="newAssignment()">+ New Assignment</button>
            </div>
        </div>
    </div>
    <div class="table-view">
        <router-outlet></router-outlet>
    </div>
</div>
