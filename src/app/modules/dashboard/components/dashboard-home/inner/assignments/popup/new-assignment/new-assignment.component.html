<div class="container" style="display: flex; justify-content: center;">
    <div class="outer-new-assigment">
        <div class="title-area">
            <span>Create New Assignment</span>
        </div>
        <form>
            <div class="form-group">
                <mat-form-field appearance="outline" class="custom-mat-form-field">
                    <mat-label>Assignment Title</mat-label>
                    <input matInput
                           [formControl]="titleControl"
                           placeholder="Ex: Java Script (max length 20)"
                           maxlength="20"
                    >
                </mat-form-field>
                <mat-form-field appearance="outline" class="custom-mat-form-field">
                    <mat-label>Select Lesson</mat-label>
                    <input type="text"
                           placeholder="Ex; pat walton"
                           [formControl]="lessonControl"
                           matInput
                           [matAutocomplete]="autoLesson">
                    <mat-autocomplete autoActiveFirstOption #autoLesson="matAutocomplete">
                        <mat-option *ngFor="let options of filteredOptions | async "
                                    [value]="options">{{options}}</mat-option>

                    </mat-autocomplete>
                </mat-form-field>

                <mat-form-field appearance="outline" class="custom-mat-form-field example-full-width">
                    <mat-label>Choose a date</mat-label>
                    <input matInput [matDatepicker]="picker">
                    <mat-hint>MM/DD/YYYY</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker [dateClass]="dateClass" #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="custom-mat-form-field">
                    <mat-label>Description</mat-label>
                    <textarea matInput
                              [formControl]="descriptionControl"
                              placeholder="Ex; course description (max length 150)"
                              maxlength="150"

                    ></textarea>
                </mat-form-field>
                <div class="save-btn-block">
                    <button mat-raised-button class="save-btn" [disabled]="titleControl.invalid ||
          descriptionControl.invalid || lessonControl.invalid || loading" (click)="saveBtn()">Save Assignment
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
