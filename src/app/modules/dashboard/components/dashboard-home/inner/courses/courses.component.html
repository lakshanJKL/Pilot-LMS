<div class="container" style="margin-top: 3%">
  <div class="course-header">
    <div class="head-title">
      <span>Courses</span>
    </div>
    <div class="btn-bar">
      <div class="inner-btn-bar">
        <button mat-raised-button class="br-btn-manage" style="vertical-align:middle"
                routerLink="/dashboard/home/users"
                *ngIf="manageBtnState"
        >
          <span>Management</span>
        </button>
        <button mat-raised-button class="br-btn-assignment" style="vertical-align:middle"
                routerLink="/dashboard/home/assignments">
          <span>Assignments</span>
        </button>
        <button mat-raised-button class="new-c-btn" (click)="newCourse()"
                *ngIf="newCourseState"
        >
          + Add New Course
        </button>
      </div>
    </div>
  </div>
  <div class="table-view">
    <router-outlet></router-outlet>
  </div>
</div>
